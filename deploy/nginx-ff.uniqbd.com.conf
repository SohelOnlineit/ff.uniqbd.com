# aaPanel site config for ff.uniqbd.com — paste INSIDE the existing server { } block.
# The panel owns listen, server_name, and ssl_certificate. Do not replace them.
# Delete the panel's default "location /" (root + index + php) and use this instead.
# AmarPin already uses 127.0.0.1:3000 and api.amarpin.com uses 4000. This site uses 3010.

client_max_body_size 10m;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;

location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
